<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b21b6">
<title>Xenon WMS — Admin</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root{
    --ink:#241539; --dim:#6f6390; --bg:#f8f6fd; --card:#ffffff; --line:#e7e0f5;
    --brand:#5b21b6; --accent:#8b5cf6; --glow:#a855f7;
    --ok:#0f9d58; --warn:#b86e00; --bad:#d23c3c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
  a{color:var(--brand)}
  .wrap{max-width:1000px;margin:0 auto;padding:14px}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .brand{font-weight:800;letter-spacing:.1em;color:var(--brand)}
  .brand b{color:var(--glow)}
  input,select,button,textarea{font:inherit}
  input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%;color:var(--ink)}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);vertical-align:middle}
  button{padding:8px 14px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
  button.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
  button.small{padding:4px 10px;font-size:13px}
  button.danger{background:#fff;color:var(--bad);border:1px solid #f1c9c9}
  button:disabled{opacity:.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  .h3row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
  .h3row h3{margin:0}
  nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
  nav button{white-space:nowrap;background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600}
  nav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  tr.dimrow td{opacity:.6}
  tr.future td{background:#fcfbff}
  tr.warnrow td{border-bottom:1px solid var(--line);padding-top:0;color:var(--bad);font-size:13px}
  tr.er{cursor:pointer} tr.er:hover td,tr.er:active td{background:#f4f0fe}
  td.ec{cursor:pointer;min-width:62px} td.ec:hover,td.ec:active{background:#f4f0fe}
  .tm{white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.5} .tm .tag{margin-left:3px;padding:0 5px}
  .tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
  .t-ok{background:#e4f6ec;color:var(--ok)} .t-warn{background:#fdf1de;color:var(--warn)}
  .t-bad{background:#fbe7e7;color:var(--bad)} .t-vio{background:#eeeafd;color:var(--accent)}
  .t-dim{background:#eef1f6;color:var(--dim)}
  .d-Cashier{color:#5b21b6;font-weight:700} .d-Checker{color:#0f766e;font-weight:700} .d-Assistant{color:#b45309;font-weight:700}
  .chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;margin:2px 4px 2px 0;background:#eeeafd;color:var(--brand)}
  .chip.off{background:#eef1f6;color:var(--dim);text-decoration:line-through}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .stat{font-size:13px;color:var(--dim)}
  .netbox{font-size:22px;font-weight:800;color:var(--brand)}
  .muted{color:var(--dim)}
  .scroll{overflow-x:auto}
  .warn{background:#fbe7e7;color:var(--bad);border-radius:8px;padding:7px 10px;margin-bottom:8px;font-size:14px;font-weight:600}
  .note{background:#f4f0fe;border-radius:8px;padding:8px 10px;font-size:13px;color:var(--dim);margin-top:10px;line-height:1.45}
  .wk{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .wk .nm{font-weight:800;font-size:16px}
  .wk .nm small{font-weight:600;color:var(--dim);font-size:12px;margin-left:6px}
  #loginView{max-width:340px;margin:12vh auto;text-align:center}
  #loginView input{width:100%;text-align:center;font-size:22px;letter-spacing:.4em;margin:12px 0}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
         padding:10px 18px;border-radius:10px;display:none;z-index:95;font-size:14px;max-width:90vw;text-align:center}
  #busy{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--glow),var(--accent));display:none;z-index:96}
  #oldApi{display:none;background:#fbe7e7;color:var(--bad);border:1px solid #f1c9c9;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
  footer{color:var(--dim);font-size:12px;text-align:center;padding:14px}

  /* dialog */
  #modal{position:fixed;inset:0;background:rgba(36,21,57,.45);display:none;align-items:flex-start;justify-content:center;z-index:90;padding:16px;overflow-y:auto}
  #modal.show{display:flex}
  #modal .box{background:#fff;border-radius:16px;width:100%;max-width:460px;margin-top:5vh;padding:16px;box-shadow:0 20px 50px rgba(36,21,57,.3)}
  #modal h4{font-size:17px;margin-bottom:12px}
  .form label{display:block;font-size:13px;color:var(--dim);font-weight:600;margin:10px 0 4px}
  .form input:not([type=checkbox]),.form select{width:100%}
  .form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form .checks label{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;font-weight:500;margin:6px 0}
  .mbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
  .mbtns .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}

  /* printing */
  #printArea{display:none}
  @media print{
    body.printing > *:not(#printArea){display:none !important}
    body.printing #printArea{display:block}
    body{background:#fff}
    @page{size:A4;margin:10mm}
  }
  .slip{padding:10mm;font-size:14px}
  .slip table{width:100%;border-collapse:collapse}
  .slip td,.slip th{border:1px solid #999;padding:8px;text-align:left}
  .qsheet{display:grid;grid-template-columns:repeat(2,85.6mm);gap:8mm 6mm;justify-content:center}
  .qcard{width:85.6mm;height:54mm;border:.3mm solid #cbbde8;border-radius:3mm;display:flex;overflow:hidden;background:#fff;
         break-inside:avoid;page-break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .qleft{width:28mm;background:linear-gradient(180deg,#6d28d9,#3b1f6e);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:3.5mm 3mm}
  .qx{font-size:8mm;font-weight:800;letter-spacing:.04em;line-height:1} .qx span{color:#d8b4fe}
  .qinst{font-size:2.1mm;line-height:1.45;letter-spacing:.06em;text-transform:uppercase;opacity:.92}
  .qright{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2mm;padding:2.5mm}
  .qqr{width:31mm;height:31mm} .qqr svg{width:100%;height:100%;display:block}
  .qname{font-size:4.3mm;font-weight:800;text-align:center;line-height:1.1;color:#241539}
  .qrole{font-size:2.1mm;letter-spacing:.15em;text-transform:uppercase;color:#7c5cbf}
  .qcode{font-size:1.9mm;color:#9a8fb8;letter-spacing:.05em}
</style>
</head>
<body>
<div id="busy"></div>

<div id="loginView" class="wrap">
  <div class="card">
    <div class="brand" style="font-size:18px">XENON <b>WMS</b></div>
    <p class="muted" style="margin-top:6px">Admin access</p>
    <input id="pinInput" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password">
    <button style="width:100%" onclick="login()">Open dashboard</button>
    <p id="loginErr" style="color:var(--bad);margin-top:10px;display:none">Wrong PIN</p>
  </div>
</div>

<div id="appView" class="wrap" style="display:none">
  <header>
    <div class="brand">XENON <b>WMS</b> · Admin</div>
    <div class="row">
      <input type="month" id="monthPick" onchange="refresh()">
      <button class="ghost small" onclick="refresh()" title="Refresh">↻</button>
    </div>
  </header>
  <div id="oldApi"><b>Your Apps Script is still the old version.</b> Open Apps Script → Deploy → Manage deployments → ✎ → Version: <b>New version</b> → Deploy. Then reload this page.</div>
  <nav id="tabs"></nav>
  <main id="view"></main>
  <footer>Dream ICT | Kasup Devendra | 071 8018 809</footer>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
/* The Apps Script URL is set once in config.js (same folder). */
const API_URL = String(window.XENON_API_URL || "").trim();
const $ = id => document.getElementById(id);
const store = { get(k){ try{ return sessionStorage.getItem(k) || ""; }catch(e){ return ""; } },
                set(k, v){ try{ sessionStorage.setItem(k, v); }catch(e){} } };
let PIN = store.get("xwms_pin");
let D = null;               // dashboard data
let TAB = "today";
const TABS = [["today","Today"],["att","Attendance"],["leave","Leaves & Holidays"],["duty","Duty Rotation"],
              ["adv","Advances"],["sal","Salary"],["workers","Workers"],["set","Settings"]];
const DUTY_NAMES = ["Cashier","Checker","Assistant Cashier"];
const DAYS = [["none","No weekly off"],["mon","Monday"],["tue","Tuesday"],["wed","Wednesday"],
              ["thu","Thursday"],["fri","Friday"],["sat","Saturday"],["sun","Sunday"]];
const DAYNAME = Object.fromEntries(DAYS);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rs = n => "Rs. " + Number(n || 0).toLocaleString("en-LK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const toast = m => { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2600); };
const pad = n => String(n).padStart(2, "0");
const localDate = (d = new Date()) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const dutyCls = d => "d-" + String(d).split(" ")[0];
const dutyHtml = d => `<span class="${dutyCls(d)}">${esc(d)}</span>`;
const fmtDay = ds => new Date(ds + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const wdShort = ds => new Date(ds + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short" });

async function api(payload){
  $("busy").style.display = "block";
  try{
    const r = await fetch(API_URL, { method: "POST", body: JSON.stringify(Object.assign({ pin: PIN }, payload)) });
    return await r.json();
  }catch(e){
    return { ok: false, message: "No connection" };
  }finally{ $("busy").style.display = "none"; }
}
async function act(payload, okMsg){
  const r = await api(payload);
  if(r.ok){ if(okMsg) toast(okMsg); await refresh(); } else toast(r.message || "Failed");
  return r;
}

function curMonth(){ return $("monthPick").value || localDate().slice(0, 7); }

async function login(){
  PIN = $("pinInput").value.trim();
  const r = await api({ action: "dashboard", month: curMonth() });
  if(!r.ok){ $("loginErr").textContent = r.message === "Wrong PIN" ? "Wrong PIN" : (r.message || "Could not connect"); $("loginErr").style.display = "block"; return; }
  store.set("xwms_pin", PIN);
  $("loginView").style.display = "none"; $("appView").style.display = "block";
  setData(r);
  drawTabs(); render();
}
async function refresh(){
  const r = await api({ action: "dashboard", month: curMonth() });
  if(!r.ok){ toast(r.message || "Failed to load"); return; }
  setData(r); render();
}
function setData(r){
  D = r;
  $("oldApi").style.display = r.api >= 2 ? "none" : "block";
  if(!(r.api >= 2)){                        // old backend: keep the page usable enough to read the message
    D.workers = (r.workers || []).filter(w => w.type !== "contract").map(w => Object.assign({ duties: [], inTime: "", outTime: "", off: "none" }, w));
    D.todayView = { list: [], free: [], off: [], warnings: [] }; D.leaveSummary = []; D.needs = {}; D.duties = {};
    D.today = localDate(); D.todayAtt = {}; D.todayLeaves = {}; D.offDays = D.offDays || [];
  }
  $("monthPick").value = r.month;
}

function drawTabs(){
  $("tabs").innerHTML = TABS.map(([k, l]) => `<button id="tab-${k}" onclick="go('${k}')">${l}</button>`).join("");
  mark();
}
function mark(){ TABS.forEach(([k]) => $("tab-" + k).className = (k === TAB ? "on" : "")); }
function go(t){ TAB = t; mark(); render(); window.scrollTo(0, 0); }

/* ---------------------------------------------------- data helpers */
const W = id => D.workers.find(w => w.id === id);
const wname = id => (W(id) || {}).name || id;
const active = () => D.workers.filter(w => w.active);
function daysInMonth(m){ return new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate(); }
const dstr = (m, d) => m + "-" + pad(d);
const attOf = (date, wid) => D.attendance.find(a => a.date === date && a.workerId === wid);
const leaveOf = (date, wid) => D.leaves.find(l => l.date === date && l.workerId === wid);
const holOf = date => (D.holidays.find(h => h.date === date) || {}).name;
// Workers to show for the selected month: active ones who had joined, plus removed ones with records that month.
function monthWorkers(){
  const end = dstr(D.month, daysInMonth(D.month));
  const has = id => D.attendance.some(a => a.workerId === id) || D.leaves.some(l => l.workerId === id) ||
    D.advances.some(a => a.workerId === id) || D.salary.some(s => s.workerId === id) ||
    Object.values(D.duties).some(v => (v.list || []).some(x => x.workerId === id));
  return D.workers.filter(w => (w.active && (!w.since || w.since <= end)) || has(w.id));
}
const nameTag = w => esc(w.name) + (w.active ? "" : ' <span class="tag t-dim">removed</span>');

/* ---------------------------------------------------- modal & printing */
function openModal(title, html, buttons){
  $("modalBox").innerHTML = `<h4>${esc(title)}</h4><div class="form">${html}</div><div class="mbtns">` +
    `<span class="left">${(buttons.left || []).map((b, i) => `<button class="${b.cls || "ghost"} small" data-l="${i}">${esc(b.label)}</button>`).join("")}</span>` +
    `<button class="ghost" data-x="1">Cancel</button>` +
    (buttons.save ? `<button data-s="1">${esc(buttons.saveLabel || "Save")}</button>` : "") + `</div>`;
  $("modalBox").querySelectorAll("[data-l]").forEach(el => el.onclick = () => buttons.left[+el.dataset.l].onClick());
  $("modalBox").querySelector("[data-x]").onclick = closeModal;
  const s = $("modalBox").querySelector("[data-s]");
  if(s) s.onclick = async () => { s.disabled = true; try{ await buttons.save(); } finally { s.disabled = false; } };
  $("modal").classList.add("show");
}
function closeModal(){ $("modal").classList.remove("show"); }
$("modal").addEventListener("click", e => { if(e.target === $("modal")) closeModal(); });

function printHtml(html){
  $("printArea").innerHTML = html;
  document.body.classList.add("printing");
  setTimeout(() => window.print(), 250);
}
window.addEventListener("afterprint", () => document.body.classList.remove("printing"));

/* ---------------------------------------------------- render */
function render(){
  if(!D) return;
  const v = $("view");
  const views = { today: vToday, att: vAtt, leave: vLeave, duty: vDuty, adv: vAdv, sal: vSal, workers: vWorkers, set: vSet };
  v.innerHTML = views[TAB]();
}

/* ---- Today ---- */
function vToday(){
  const v = D.todayView, att = D.todayAtt || {}, lv = D.todayLeaves || {};
  let body;
  if(v.holiday) body = `<span class="tag t-warn">Holiday — ${esc(v.holiday)}</span>`;
  else if(!active().length) body = `<p class="muted">No workers yet. Add them in the <a href="#" onclick="go('workers');return false">Workers</a> tab.</p>`;
  else {
    const rows = v.list.map(x => Object.assign({ kind: "duty" }, x))
      .concat(v.free.map(x => Object.assign({ kind: "free" }, x)), v.off.map(x => Object.assign({ kind: "off" }, x)));
    body = `<div class="scroll"><table><tr><th>Worker</th><th>Duty</th><th>In</th><th>Out</th></tr>` + rows.map(x => {
      const a = att[x.workerId] || {}, w = W(x.workerId) || {}, l = lv[x.workerId];
      const duty = x.kind === "duty" ? dutyHtml(x.duty) : x.kind === "free" ? '<span class="muted">No duty</span>' : `<span class="tag t-dim">${esc(x.reason)}</span>`;
      const inT = a.inTime ? a.inTime + (a.late ? ' <span class="tag t-bad">Late</span>' : "")
                : (l ? `<span class="tag t-vio">${l.type === "half" ? "½ day leave" : "Leave"}</span>` : "—");
      const outT = a.outTime ? a.outTime + (a.early ? ' <span class="tag t-bad">Early</span>' : "") : "—";
      return `<tr class="${x.kind === "off" && !a.inTime ? "dimrow" : ""}"><td><b>${esc(x.name)}</b><div class="stat">${esc(w.inTime || "")}–${esc(w.outTime || "")}</div></td>
        <td>${duty}</td><td>${inT}</td><td>${outT}</td></tr>`;
    }).join("") + `</table></div>`;
  }
  const warn = (v.warnings || []).map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join("");
  const inCount = Object.values(att).filter(a => a.inTime).length;
  const expected = v.list.length + v.free.length;
  return `<div class="card"><h3>Today — ${fmtDay(D.today)}</h3>${warn}${body}
    <p class="stat" style="margin-top:8px">${v.holiday ? "" : `Checked in: <b>${inCount}</b> of <b>${expected}</b> working today. `}${v.fixed ? "🔒 Today's duties were fixed at the first check-in." : "Duties are fixed when the first person checks in."}</p></div>`;
}

/* ---- Attendance ---- */
function vAtt(){
  const m = D.month, n = daysInMonth(m), ws = monthWorkers();
  if(!ws.length) return `<div class="card"><p class="muted">No workers for this month.</p></div>`;
  const sum = {}; ws.forEach(w => sum[w.id] = { p: 0, late: 0, early: 0, full: 0, half: 0 });
  let body = "";
  for(let d = 1; d <= n; d++){
    const date = dstr(m, d), hol = holOf(date), du = D.duties[date] || {};
    body += `<tr><td><b>${d}</b> <span class="muted">${wdShort(date)}</span>${hol ? `<br><span class="tag t-warn">${esc(hol)}</span>` : ""}</td>` +
      ws.map(w => {
        const a = attOf(date, w.id), l = leaveOf(date, w.id);
        const isOff = (du.off || []).some(x => x.workerId === w.id && x.reason === "Weekly off");
        let cell = "";
        if(isOff && !a) cell = `<span class="tag t-dim">Off</span>`;
        if(l){ cell = `<span class="tag t-vio">${l.type === "half" ? "½ day" : "Leave"}</span>`; sum[w.id][l.type === "half" ? "half" : "full"]++; }
        if(a){
          sum[w.id].p++; if(a.late) sum[w.id].late++; if(a.early) sum[w.id].early++;
          cell += `<div class="tm">${a.inTime || "—"}${a.late ? '<span class="tag t-bad">L</span>' : ""}</div>` +
                  `<div class="tm">${a.outTime || "…"}${a.early ? '<span class="tag t-bad">E</span>' : ""}</div>`;
        }
        if(!a && !l && !hol && !isOff) cell = `<span class="muted">—</span>`;
        return `<td class="ec" onclick="editAtt('${date}','${w.id}')">${cell}</td>`;
      }).join("") + "</tr>";
  }
  return `<div class="card"><h3>Attendance — ${m}</h3><div class="scroll">
    <table><tr><th>Day</th>${ws.map(w => `<th>${nameTag(w)}</th>`).join("")}</tr>${body}
    <tr><td><b>Summary</b></td>${ws.map(w => {
      const s = sum[w.id];
      return `<td class="stat">Present <b>${s.p}</b> · Late <b>${s.late}</b> · Early <b>${s.early}</b><br>Leave full <b>${s.full}</b> · half <b>${s.half}</b></td>`;
    }).join("")}</tr></table></div>
    <p class="stat" style="margin-top:8px">Each cell shows IN above OUT. <b>Tap a cell</b> to add or correct times (forgot to scan, etc.). L = late, E = left early — for information only, salary is never changed automatically.</p></div>`;
}

function editAtt(date, wid){
  const a = attOf(date, wid) || {};
  openModal(`${wname(wid)} — ${fmtDay(date)}`, `
    <div class="two"><div><label>IN time</label><input type="time" id="eaIn" value="${esc(a.inTime || "")}"></div>
    <div><label>OUT time</label><input type="time" id="eaOut" value="${esc(a.outTime || "")}"></div></div>
    <label>Note</label><input id="eaNote" value="${esc(a.note || "")}" placeholder="e.g. forgot card">
    <p class="stat" style="margin-top:8px">Late / early are worked out from ${esc(wname(wid))}'s own times.</p>`,
    { left: a.inTime || a.outTime ? [{ label: "Delete record", cls: "danger", onClick: async () => {
        if(!confirm("Delete this attendance record?")) return;
        const r = await act({ action: "editAttendance", date, workerId: wid, inTime: "", outTime: "" }, "Deleted"); if(r.ok) closeModal(); } }] : [],
      save: async () => {

/* ---- Duty rotation ---- */
function vDuty(){
  const m = D.month, n = daysInMonth(m), ws = monthWorkers(), cols = ws.length + 1;
  let body = "";
  for(let d = 1; d <= n; d++){
    const date = dstr(m, d), du = D.duties[date] || { list: [], off: [], free: [], warnings: [] };
    const future = date > D.today;
    const canEdit = !du.holiday;
    const tags = du.manual ? ' <span class="tag t-vio">edited</span>' : (du.fixed && !du.none ? " 🔒" : "");
    body += `<tr class="${future ? "future" : ""}${canEdit ? " er" : ""}"${canEdit ? ` onclick="editDuty('${date}')"` : ""}>` +
            `<td style="white-space:nowrap"><b>${d}</b> <span class="muted">${wdShort(date)}</span>${tags}</td>`;
    if(du.holiday) body += `<td colspan="${ws.length}"><span class="tag t-warn">${esc(du.holiday)}</span></td>`;
    else if(du.none) body += `<td colspan="${ws.length}"><span class="muted">No record — tap to set</span></td>`;
    else {
      body += ws.map(w => {
        const a = (du.list || []).find(x => x.workerId === w.id);
        if(a) return `<td>${dutyHtml(a.duty)}</td>`;
        const o = (du.off || []).find(x => x.workerId === w.id);
        if(o) return `<td><span class="tag t-dim">${esc(o.reason === "Weekly off" ? "Off" : o.reason)}</span></td>`;
        if((du.free || []).some(x => x.workerId === w.id)) return `<td><span class="muted">No duty</span></td>`;
        return `<td><span class="muted">—</span></td>`;
      }).join("");
    }
    body += "</tr>";
    if((du.warnings || []).length) body += `<tr class="warnrow"><td></td><td colspan="${cols - 1}">⚠ ${du.warnings.map(esc).join(" · ")}</td></tr>`;
  }
  const needs = D.needs || {};
  const needTxt = DUTY_NAMES.map(t => `${needs[t] ?? 1} ${t}`).join(", ");
  return `
  <div class="card"><h3>Weekly off — change for one week</h3>
    ${active().length ? `<div class="row" style="margin-bottom:10px">
      <select id="odW">${active().map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join("")}</select>
      <input type="date" id="odD" value="${D.today}">
      <button onclick="setOffDay()">Set off day</button>
    </div>` : ""}
    ${(D.offDays && D.offDays.length) ? `<div class="scroll"><table><tr><th>Date</th><th>Worker</th><th></th></tr>` +
      D.offDays.map(o => `<tr><td>${fmtDay(o.date)}</td><td>${esc(wname(o.workerId))}</td>
        <td><button class="ghost small" onclick="delOffDay('${o.date}','${o.workerId}')">✕</button></td></tr>`).join("") + `</table></div>`
      : `<p class="muted">No changes this month — everyone has their usual weekly off (set in Workers).</p>`}
    <p class="stat" style="margin-top:8px">A date set here replaces that worker's usual off day <b>for that week only</b> (Mon–Sun). Next week goes back to normal. ✕ removes the change.</p>
  </div>
  <div class="card"><h3>Duty rotation — ${m}</h3>
    <div class="scroll"><table><tr><th>Day</th>${ws.map(w => `<th>${nameTag(w)}</th>`).join("")}</tr>${body}</table></div>
    <div class="note">Each day needs <b>${esc(needTxt)}</b> (change in Settings). Duties go only to people working that day and ticked for the duty, and are shared fairly — each person's duty changes day to day where possible.
    With fewer people, every duty gets one person first (2 people → Cashier + Checker). Extra people join a duty they are ticked for.<br>
    🔒 = fixed: past days and today (from the first check-in) never change by themselves. Future days are a forecast and adjust to leave and off days. <b>Tap a day</b> to set its duties by hand.</div></div>`;
}
async function setOffDay(){ await act({ action: "setOffDay", date: $("odD").value, workerId: $("odW").value }, "Off day set for that week"); }
async function delOffDay(d, w){ await act({ action: "deleteOffDay", date: d, workerId: w }, "Back to the usual off day"); }

function editDuty(date){
  const du = D.duties[date];
  if(!du || du.holiday) return toast("Holiday — no duties");
  const ids = active().map(w => w.id);
  (du.list || []).forEach(x => { if(!ids.includes(x.workerId)) ids.push(x.workerId); });
  const cur = id => {
    const a = (du.list || []).find(x => x.workerId === id); if(a) return a.duty;
    if((du.free || []).some(x => x.workerId === id)) return "None";
    return "Out";
  };
  const opts = [["Cashier","Cashier"],["Checker","Checker"],["Assistant Cashier","Assistant Cashier"],["None","No duty"],["Out","Not working"]];
  const past = date < D.today;
  openModal(`Duties — ${fmtDay(date)}`, ids.map(id => {
      const w = W(id) || { name: id, duties: [] };
      return `<label>${esc(w.name)} <span style="font-weight:400">· ticked: ${w.duties.length ? w.duties.map(esc).join(", ") : "none"}</span></label>
        <select data-w="${esc(id)}">${opts.map(([v, l]) => `<option value="${v}" ${cur(id) === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
    }).join("") + `<p class="stat" style="margin-top:10px">${past ? "This corrects the record for a past day." : "This day will keep exactly these duties."} Weekly off and leave still show in the other tabs.</p>`,
    { left: du.manual ? [{ label: "Back to automatic", onClick: async () => {
        const r = await act({ action: "clearDutyOverride", date }, "Back to automatic"); if(r.ok) closeModal(); } }] : [],
      save: async () => {
        const assignments = [...$("modalBox").querySelectorAll("select[data-w]")].map(s => ({ workerId: s.dataset.w, duty: s.value }));
        const r = await act({ action: "setDutyOverride", date, assignments }, "Duties saved");
        if(r.ok) closeModal();
      } });
}

}

  return `
  <div class="card"><h3>Duties needed each day</h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      ${[["NEED_CASHIER","Cashier"],["NEED_CHECKER","Checker"],["NEED_ASST","Assistant Cashier"]].map(([k, l]) =>
        `<label class="stat" style="font-weight:600">${l}<br><input type="number" id="st-${k}" min="0" max="20" value="${esc(s[k])}" style="width:100%;margin-top:4px"></label>`).join("")}
    </div>
    <div class="row" style="margin-top:10px"><button onclick="saveNeeds()">Save</button></div>
    <div class="note">Places are filled in this order: one Cashier, one Checker, one Assistant Cashier, then the second places, and so on.
    So with 2 people working you still get Cashier + Checker. People beyond the places join a duty they are ticked for (Cashier only if that's their only tick).
    Set a number to 0 if that duty is not needed.</div></div>
  <div class="card"><h3>Late grace</h3>
    <div class="row"><input type="number" id="st-GRACE_MIN" min="0" max="180" value="${esc(s.GRACE_MIN)}" style="width:110px"> minutes
      <button class="ghost small" onclick="saveOne('GRACE_MIN')">Save</button></div>
    <p class="stat" style="margin-top:8px">A worker is late (red screen) when they scan IN more than this many minutes after their own in time. Each worker's in/out times are in the Workers tab.</p></div>
  <div class="card"><h3>Admin PIN</h3>
    <div class="row"><input type="password" id="st-PIN" placeholder="New PIN" inputmode="numeric" autocomplete="new-password" style="width:160px">
      <button class="ghost small" onclick="savePin()">Change PIN</button></div></div>
  <div class="card"><p class="stat">All data is stored in your Google Sheet (Xenon WMS Data). You can open the Sheet any time to view or back up everything (File → Download → Excel).</p></div>`;
}
async function saveNeeds(){
  const values = {};
  ["NEED_CASHIER","NEED_CHECKER","NEED_ASST"].forEach(k => values[k] = $("st-" + k).value.trim());
  await act({ action: "updateSettings", values }, "Saved — the rotation now uses these numbers");
}
async function saveOne(k){ await act({ action: "updateSettings", values: { [k]: $("st-" + k).value.trim() } }, "Saved"); }
async function savePin(){
  const p = $("st-PIN").value.trim();
  if(p.length < 4) return toast("PIN must be at least 4 characters");
  const r = await api({ action: "updateSettings", values: { PIN: p } });
  if(r.ok){ PIN = p; store.set("xwms_pin", p); toast("PIN changed"); refresh(); } else toast(r.message);
}

/* ---- boot ---- */
$("monthPick").value = localDate().slice(0, 7);
if(!API_URL){
  $("loginView").innerHTML = '<div class="card">Setup needed: put your Apps Script URL into <b>config.js</b> (same folder as this page).</div>';
}else if(PIN){
  $("pinInput").value = PIN; login();
}
$("pinInput") && $("pinInput").addEventListener("keydown", e => { if(e.key === "Enter") login(); });
</script>
</body>
</html>
