<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150D30">
<title>Xenon WMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--night:#150D30;--night2:#24134F;--glow:#C4B5FF;--ink:#F4F0FF;--dim:#A99BD6;--faint:rgba(196,181,255,.16)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--night)}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:28px 20px;
       font-family:"Figtree",system-ui,sans-serif;color:var(--ink)}
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 70% at 50% 0%, #3A1F7A 0%, var(--night2) 40%, var(--night) 78%)}
  .ic{width:28px;height:28px;flex:none}
  .head{text-align:center}
  .tile{width:76px;height:76px;border-radius:20px;position:relative;display:grid;place-items:center;margin:0 auto 18px;
        background:linear-gradient(150deg,#7B54FF,#4423B8);box-shadow:0 0 0 1px rgba(196,181,255,.35) inset,0 0 44px rgba(138,99,255,.5)}
  .tile b{font-family:"Unbounded",sans-serif;font-weight:700;font-size:30px;color:#fff;letter-spacing:-.02em}
  .tile i{position:absolute;top:7px;left:9px;font-style:normal;font-size:11px;font-weight:700;color:var(--glow)}
  h1{font-family:"Unbounded",sans-serif;font-weight:600;font-size:26px;letter-spacing:-.01em}
  .head p{color:var(--dim);margin-top:6px}
  .links{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px}
  a{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;text-decoration:none;color:var(--ink);
    background:rgba(255,255,255,.05);border:1px solid var(--faint)}
  a:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
  a .ib{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(196,181,255,.12);color:var(--glow)}
  a.main{background:linear-gradient(135deg,#6D3FF0,#4A23C4);border-color:#8C6CFF;box-shadow:0 10px 34px rgba(106,61,240,.45)}
  a.main .ib{background:rgba(255,255,255,.16);color:#fff}
  a b{display:block;font-size:18px}
  a span span{display:block;color:var(--dim);font-size:13.5px;margin-top:2px}
  a.main span span{color:#E2DAFF}
  footer{color:var(--dim);font-size:12px;opacity:.8;text-align:center}
</style>
</head>
